<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Register</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #667eea, #764ba2);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            width: 950px;
            min-height: 600px;
            background: white;
            border-radius: 25px;
            overflow: hidden;
            display: flex;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.25);
        }

        .left {
            width: 40%;
            background: linear-gradient(160deg, #162c70, #5426a8);
            color: white;
            padding: 60px 40px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .left h1 {
            font-size: 42px;
            margin-bottom: 20px;
        }

        .left p {
            font-size: 18px;
            line-height: 1.8;
            color: #e2e2e2;
        }

        .features {
            margin-top: 40px;
        }

        .feature {
            margin-bottom: 25px;
        }

        .feature h3 {
            margin-bottom: 7px;
        }

        .feature p {
            font-size: 14px;
        }

        .right {
            width: 60%;
            padding: 50px;
        }

        .right h2 {
            font-size: 35px;
            text-align: center;
            margin-bottom: 10px;
            color: #222;
        }

        .subtitle {
            text-align: center;
            color: #777;
            margin-bottom: 35px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            color: #333;
        }

        input {
            width: 100%;
            padding: 15px;
            margin-bottom: 20px;
            border: 1px solid #ddd;
            border-radius: 12px;
            font-size: 16px;
            outline: none;
            transition: 0.3s;
        }

        input:focus {
            border-color: #6c3bd1;
            box-shadow: 0 0 8px rgba(108, 59, 209, 0.3);
        }

        button {
            width: 100%;
            padding: 16px;
            border: none;
            border-radius: 12px;
            background: linear-gradient(90deg, #5f42d8, #9c35d1);
            color: white;
            font-size: 18px;
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(108, 59, 209, 0.3);
        }

        .login {
            text-align: center;
            margin-top: 25px;
            color: #777;
        }

        .login a {
            color: #653bd3;
            text-decoration: none;
            font-weight: bold;
        }

        @media (max-width: 800px) {

            .container {
                flex-direction: column;
            }

            .left,
            .right {
                width: 100%;
            }

            .left {
                padding: 40px;
            }

        }

    </style>

</head>

<body>

    <div class="container">

        <div class="left">

            <h1>مرحبًا بك 👋</h1>

            <p>
                أنشئ حسابك الآن وانضم إلينا!
            </p>

            <div class="features">

                <div class="feature">
                    <h3>🔒 حساب آمن</h3>
                    <p>بياناتك محفوظة بطريقة آمنة.</p>
                </div>

                <div class="feature">
                    <h3>⚡ سريع وسهل</h3>
                    <p>أنشئ حسابك في أقل من دقيقة.</p>
                </div>

                <div class="feature">
                    <h3>👥 انضم إلينا</h3>
                    <p>كن جزءًا من مجتمعنا.</p>
                </div>

            </div>

        </div>


        <div class="right">

            <h2>Create Account</h2>

            <p class="subtitle">
                أدخل بياناتك لإنشاء حساب جديد
            </p>


            <form action="http://127.0.0.1:8000/register" method="post">

                <label>الاسم بالكامل</label>

                <input
                    type="text"
                    name="full_name"
                    placeholder="أدخل اسمك"
                    required
                >


                <label>رقم الهاتف</label>

                <input
                    type="text"
                    name="phone"
                    placeholder="010XXXXXXXX"
                    required
                >


                <label>البريد الإلكتروني</label>

                <input
                    type="email"
                    name="email"
                    placeholder="example@mail.com"
                    required
                >


                <label>كلمة المرور</label>

                <input
                    type="password"
                    name="password"
                    placeholder="أدخل كلمة المرور"
                    required
                >


                <label>المدينة</label>

                <input
                    type="text"
                    name="city"
                    placeholder="أدخل مدينتك"
                    required
                >


                <button type="submit">
                    إنشاء حساب
                </button>

            </form>


            <div class="login">
                لديك حساب بالفعل؟
                <a href="#">تسجيل الدخول</a>
            </div>

        </div>

    </div>

</body>

</html>
